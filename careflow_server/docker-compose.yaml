version: '3.8'

services:
  serverpod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careflow_serverpod
    restart: unless-stopped
    ports:
      - "8080:8080" # API & WebSockets
      - "8081:8081" # Insights Server
      - "8082:8082" # Web Server
    environment:
      - runmode=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: careflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: careflow_dev_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
