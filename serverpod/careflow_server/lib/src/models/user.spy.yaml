class: User
table: careflow_users
fields:
  name: String
  email: String
  phone: String
  passwordHash: String?
  role: String
  isActive: bool, default=true
  isVerified: bool, default=true
  lastLogin: DateTime?
  createdAt: DateTime?
  updatedAt: DateTime?
indexes:
  user_email_idx:
    fields: email
    unique: true
