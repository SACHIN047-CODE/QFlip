services:
  # Serverpod Dart Backend Service
  - type: web
    name: careflow-serverpod-backend
    runtime: docker
    dockerfilePath: ./careflow_server/Dockerfile
    dockerContext: ./careflow_server
    plan: free
    region: singapore
    branch: sachin
    envVars:
      - key: runmode
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: careflow-postgres
          property: connectionString

  # Web Frontend Service
  - type: web
    name: careflow-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: singapore
    branch: sachin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Database for Serverpod
  - name: careflow-postgres
    plan: free
    region: singapore
    databaseName: careflow
    user: postgres
